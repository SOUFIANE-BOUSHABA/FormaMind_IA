[project]
name = "formamind-ai-backend"
version = "0.1.0"
description = "FastAPI foundation for FormaMind AI."
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2.0",
  "chromadb>=1.0,<2.0",
  "crewai[google-genai]>=1.14,<2.0",
  "email-validator>=2.2,<3.0",
  "fastapi>=0.111,<1.0",
  "google-genai>=1.0,<2.0",
  "llama-index-core>=0.14,<1.0",
  "llama-index-embeddings-huggingface>=0.6,<1.0",
  "llama-index-vector-stores-chroma>=0.5,<1.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "PyJWT>=2.9,<3.0",
  "PyMuPDF>=1.24,<2.0",
  "python-dotenv>=1.0,<2.0",
  "python-multipart>=0.0.9,<1.0",
  "sentence-transformers>=3.0,<4.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.2,<9.0",
  "ruff>=0.6,<1.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"