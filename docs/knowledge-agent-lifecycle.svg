<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180" role="img" aria-labelledby="title desc">
  <title id="title">FormaMind AI Knowledge Agent lifecycle</title>
  <desc id="desc">Step by step flow from user question to agent memory, decisions, LlamaIndex Chroma retrieval, Gemini answer, citation verification, and final response.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f7ff"/>
      <stop offset="0.55" stop-color="#eef5ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4328e7"/>
      <stop offset="1" stop-color="#6c4df7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#321e94" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 14 7 L 0 14 z" fill="#4328e7"/>
    </marker>
    <marker id="arrowRed" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 14 7 L 0 14 z" fill="#dc2626"/>
    </marker>
    <style>
      .title { font: 800 42px Inter, Arial, sans-serif; fill: #07142f; }
      .subtitle { font: 500 20px Inter, Arial, sans-serif; fill: #64708a; }
      .section { font: 800 14px Inter, Arial, sans-serif; fill: #4328e7; letter-spacing: 1.4px; }
      .h { font: 800 23px Inter, Arial, sans-serif; fill: #07142f; }
      .body { font: 500 16px Inter, Arial, sans-serif; fill: #506078; }
      .code { font: 700 14px Consolas, "Courier New", monospace; fill: #17213b; }
      .badge { font: 800 18px Inter, Arial, sans-serif; fill: #ffffff; }
      .card { fill: #ffffff; stroke: #dce3f3; stroke-width: 1.5; filter: url(#shadow); }
      .soft { fill: #f4f2ff; stroke: #d8d1ff; stroke-width: 1.5; }
      .store { fill: #f0fbff; stroke: #bdefff; stroke-width: 1.5; }
      .guard { fill: #fff7ed; stroke: #ffd9a8; stroke-width: 1.5; }
      .ok { fill: #ecfdf5; stroke: #a7f3d0; stroke-width: 1.5; }
      .error { fill: #fff4f4; stroke: #ffb7b7; stroke-width: 1.5; }
      .line { stroke: #4328e7; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .redLine { stroke: #dc2626; stroke-width: 3; fill: none; marker-end: url(#arrowRed); }
      .thin { stroke: #8c7cf8; stroke-width: 2.4; fill: none; stroke-dasharray: 8 8; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1800" height="1180" fill="url(#bg)"/>
  <text x="70" y="78" class="title">Knowledge Agent lifecycle - FormaMind AI</text>
  <text x="70" y="113" class="subtitle">From assistant question to memory, decisions, LlamaIndex/Chroma retrieval, Gemini, citation verification, and safe answer.</text>

  <rect x="70" y="165" width="315" height="178" rx="24" class="card"/>
  <circle cx="115" cy="214" r="27" fill="url(#primary)"/><text x="108" y="221" class="badge">1</text>
  <text x="150" y="200" class="section">FRONTEND</text>
  <text x="150" y="232" class="h">AssistantPage</text>
  <text x="100" y="276" class="body">User selects ready PDFs</text>
  <text x="100" y="306" class="code">question + document_ids</text>

  <path class="line" d="M 390 254 H 455"/>

  <rect x="470" y="165" width="330" height="178" rx="24" class="card"/>
  <circle cx="515" cy="214" r="27" fill="url(#primary)"/><text x="508" y="221" class="badge">2</text>
  <text x="550" y="200" class="section">FASTAPI ROUTE</text>
  <text x="550" y="232" class="h">ask_question()</text>
  <text x="500" y="276" class="code">app.api.routes.assistant</text>
  <text x="500" y="306" class="body">CurrentUser + request schema</text>

  <path class="line" d="M 805 254 H 870"/>

  <rect x="885" y="165" width="350" height="178" rx="24" class="guard"/>
  <circle cx="930" cy="214" r="27" fill="#f59e0b"/><text x="923" y="221" class="badge">3</text>
  <text x="965" y="200" class="section">SERVICE GUARD</text>
  <text x="965" y="232" class="h">AssistantService</text>
  <text x="915" y="276" class="code">app.services.assistant</text>
  <text x="915" y="306" class="body">checks ownership + ready status</text>

  <path class="line" d="M 1240 254 H 1305"/>

  <rect x="1320" y="165" width="390" height="178" rx="24" class="soft"/>
  <circle cx="1365" cy="214" r="27" fill="url(#primary)"/><text x="1358" y="221" class="badge">4</text>
  <text x="1400" y="200" class="section">AGENT CORE</text>
  <text x="1400" y="232" class="h">KnowledgeAgent.answer()</text>
  <text x="1350" y="276" class="code">app.agents.knowledge_agent</text>
  <text x="1350" y="306" class="body">creates KnowledgeAgentState</text>

  <rect x="120" y="455" width="360" height="205" rx="24" class="store"/>
  <circle cx="165" cy="505" r="27" fill="#0891b2"/><text x="158" y="512" class="badge">5</text>
  <text x="200" y="490" class="section">SHORT TERM MEMORY</text>
  <text x="200" y="522" class="h">AgentMemoryStore</text>
  <text x="150" y="566" class="code">app.agents.memory</text>
  <text x="150" y="596" class="body">key: user + selected docs</text>
  <text x="150" y="626" class="body">recent successful turns only</text>

  <path class="line" d="M 1515 348 C 1515 410 450 405 350 450"/>

  <rect x="590" y="455" width="410" height="205" rx="24" class="soft"/>
  <circle cx="635" cy="505" r="27" fill="url(#primary)"/><text x="628" y="512" class="badge">6</text>
  <text x="670" y="490" class="section">DECISION LAYER</text>
  <text x="670" y="522" class="h">AgentDecisionPolicy</text>
  <text x="620" y="566" class="code">app.agents.decision_policy</text>
  <text x="620" y="596" class="body">direct_retrieval or memory_follow_up</text>
  <text x="620" y="626" class="body">creates query variants</text>

  <path class="line" d="M 485 558 H 575"/>

  <rect x="1110" y="455" width="430" height="205" rx="24" class="card"/>
  <circle cx="1155" cy="505" r="27" fill="url(#primary)"/><text x="1148" y="512" class="badge">7</text>
  <text x="1190" y="490" class="section">RETRIEVAL TOOL</text>
  <text x="1190" y="522" class="h">RetrieverTool.search()</text>
  <text x="1140" y="566" class="code">app.rag.retriever</text>
  <text x="1140" y="596" class="body">EmbeddingService embeds query</text>
  <text x="1140" y="626" class="body">Chroma filters user + document_ids</text>

  <path class="line" d="M 1005 558 H 1095"/>

  <rect x="120" y="760" width="390" height="190" rx="24" class="store"/>
  <circle cx="165" cy="810" r="27" fill="#0891b2"/><text x="158" y="817" class="badge">8</text>
  <text x="200" y="795" class="section">VECTOR STORE</text>
  <text x="200" y="827" class="h">LlamaIndex + Chroma</text>
  <text x="150" y="871" class="code">ChromaVectorStore.search()</text>
  <text x="150" y="901" class="body">returns RetrievedChunk schemas</text>

  <path class="line" d="M 1325 665 C 1325 735 585 725 450 755"/>

  <rect x="620" y="760" width="410" height="190" rx="24" class="guard"/>
  <circle cx="665" cy="810" r="27" fill="#f59e0b"/><text x="658" y="817" class="badge">9</text>
  <text x="700" y="795" class="section">CONTEXT CHECK</text>
  <text x="700" y="827" class="h">Sufficiency decision</text>
  <text x="650" y="871" class="body">best relevance score</text>
  <text x="650" y="901" class="body">retry if weak; refuse if unreliable</text>

  <path class="line" d="M 515 855 H 605"/>
  <path class="thin" d="M 825 755 C 825 700 775 690 740 665"/>

  <rect x="1140" y="760" width="390" height="190" rx="24" class="card"/>
  <circle cx="1185" cy="810" r="27" fill="url(#primary)"/><text x="1178" y="817" class="badge">10</text>
  <text x="1220" y="795" class="section">LLM ANSWER</text>
  <text x="1220" y="827" class="h">GeminiLlmService</text>
  <text x="1170" y="871" class="code">app.services.llm</text>
  <text x="1170" y="901" class="body">French answer, JSON, citations only</text>

  <path class="line" d="M 1035 855 H 1125"/>

  <rect x="360" y="1010" width="420" height="125" rx="24" class="ok"/>
  <circle cx="405" cy="1058" r="27" fill="#10b981"/><text x="394" y="1065" class="badge">11</text>
  <text x="440" y="1045" class="section">SELF CHECK</text>
  <text x="440" y="1077" class="h">CitationVerifier</text>
  <text x="440" y="1107" class="body">sources must match retrieved chunks</text>

  <path class="line" d="M 1335 955 C 1335 1010 875 1015 785 1060"/>

  <rect x="950" y="1010" width="340" height="125" rx="24" class="ok"/>
  <text x="985" y="1048" class="section">SUCCESS RESPONSE</text>
  <text x="985" y="1080" class="h">Grounded answer</text>
  <text x="985" y="1110" class="body">answer + has_sufficient_context + sources</text>

  <path class="line" d="M 785 1072 H 935"/>

  <rect x="1360" y="1010" width="350" height="125" rx="24" class="error"/>
  <text x="1395" y="1048" class="section" fill="#dc2626">SAFE REFUSAL</text>
  <text x="1395" y="1080" class="h">NO_CONTEXT_ANSWER</text>
  <text x="1395" y="1110" class="body">no reliable context or bad citations</text>

  <path class="redLine" d="M 825 950 C 825 1015 1270 1000 1350 1050"/>
  <path class="redLine" d="M 780 1078 C 880 1145 1270 1145 1360 1100"/>

  <rect x="70" y="1010" width="220" height="125" rx="24" class="soft"/>
  <text x="105" y="1048" class="section">INTERNAL STATE</text>
  <text x="105" y="1080" class="code">KnowledgeAgentState</text>
  <text x="105" y="1110" class="body">strategy, attempts, confidence</text>
</svg>
